name: vm-manager-docker

services:
  app:
    build:
      context: .
      args:
        APP_UID: ${LOCAL_UID:-1000}
        APP_GID: ${LOCAL_GID:-1000}
    image: vm-manager-docker:local
    restart: unless-stopped
    init: true
    ports:
      - "127.0.0.1:${VM_MANAGER_PORT:-8080}:8080"
    environment:
      VM_MANAGER_CONFIG: /data/config.toml
      VM_MANAGER_DATA: /data
      VM_MANAGER_PUBLIC_KEY: /data/ssh/id_ed25519.pub
    volumes:
      - app-data:/data
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    stop_grace_period: 15s

volumes:
  app-data:
